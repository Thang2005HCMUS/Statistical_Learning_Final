# Images and labels direcotry should be relative to train.py
TRAIN_DIR_IMAGES: '../data/Fisheye8K_train_split/train/images'
TRAIN_DIR_LABELS: '../data/Fisheye8K_train_split/train/labels'
VALID_DIR_IMAGES: '../data/Fisheye8K_train_split/val/images'
VALID_DIR_LABELS: '../data/Fisheye8K_train_split/val/labels'
# Optional test data path. If given, test paths (data) will be used in
# `eval.py`.
TEST_DIR_IMAGES: '../data/Fisheye8K/test/images'
TEST_DIR_LABELS: '../data/Fisheye8K/test/labels'

# Class names.
# For YOLO annotations, give the names in order of the data.yaml file here.
CLASSES: [
    '__background__',
    'bus', 'bike', 'car', 
    'pedestrian', 'truck'
]

# Number of classes (object classes + 1 for background class in Faster RCNN).
NC: 6

# Whether to save the predictions of the validation set while training.
SAVE_VALID_PREDICTION_IMAGES: True